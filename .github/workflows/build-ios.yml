name: build-ios

# 没有 Mac，就用 GitHub 的 macOS runner 编译。
# 公开仓库的 macOS 额度免费且不限时；私有仓库会按 10 倍扣分钟数。

on:
  push:
    branches: [main]
    # 纯文档/说明改动不烧 macOS runner 额度（公开仓库免费但没必要）
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          echo "node $(node -v) / npm $(npm -v)"
          pod --version || echo "CocoaPods 未预装"

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 源码自检与单元测试
        run: |
          npm run check
          npm test

      - name: 生成 iOS 工程并登记四个原生插件
        # scripts/ios-setup.cjs 内部会 cap add ios，再把
        # Audio / OCR / SecureStore / Share 四个 Swift 插件接进 pbxproj，
        # 并把 package.json 的版本号灌进 Info.plist
        run: npm run ios:setup

      - name: 断言四个插件已进入 App target 的 Sources 阶段
        # 这一条是硬闸门。`xcode@3` 的 writeSync() 只返回字符串不写盘，
        # 之前就是这样静默失败：构建"成功"，但 App target 只编了 AppDelegate.swift。
        run: |
          set -e
          PBX=ios/App/App.xcodeproj/project.pbxproj
          echo "pwd = $(pwd)"
          ls -l ios/App/App.xcodeproj/ || true
          [ -f "$PBX" ] || { echo "::error::pbxproj 不存在：$PBX"; exit 1; }
          SZ=$(wc -c < "$PBX")
          echo "pbxproj = $SZ 字节"
          [ "$SZ" -gt 1000 ] || { echo "::error::pbxproj 只有 $SZ 字节"; exit 1; }
          for f in ShuyinAudioPlugin ShuyinSecureStorePlugin ShuyinOCRPlugin ShuyinSharePlugin ShuyinNeuralTtsPlugin; do
            n=$(grep -c "$f.swift in Sources" "$PBX" || true)
            echo "  $f -> $n 处"
            [ "$n" -ge 2 ] || { echo "::error::$f 没进 Sources 构建阶段（$n 处，应为 2）"; exit 1; }
          done
          echo "四个插件都在 Sources 构建阶段"

      - name: 调试 —— 检查组装的 SPM 段
        if: always()
        run: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          echo "--- SPM 关键字 ---"
          grep -n "packageProductDependencies\|packageReferences\|XCRemoteSwiftPackageReference\|XCSwiftPackageProductDependency" "$PBX" | head -20 || echo "（一个都没有）"
          echo "--- App target 原文 ---"
          awk '/Begin PBXNativeTarget section/,/End PBXNativeTarget section/' "$PBX" | head -60

      - name: 下载离线语音模型（sherpa-onnx VITS 中文）
        # 模型不进源码仓库，打包时现拉。放在 www/tts/ 下，cap sync 会拷进 public/，
        # Swift 侧从 Bundle.main/public/tts/<目录>/ 读 onnx + tokens.txt
        run: |
          set -euo pipefail
          mkdir -p www/tts
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-zh_CN-chaowen-medium-int8.tar.bz2"
          ok=0
          for i in 1 2 3 4 5; do
            if curl -sL -C - --retry 3 --retry-delay 3 -m 900 -o /tmp/model.tar.bz2 "$URL" && tar -tjf /tmp/model.tar.bz2 >/dev/null 2>&1; then ok=1; break; fi
            echo "第 $i 次下载不完整，重试…"
            sleep 3
          done
          [ "$ok" = "1" ] || { echo "::error::离线语音模型下载失败"; exit 1; }
          tar -xjf /tmp/model.tar.bz2 -C www/tts
          DIR=$(find www/tts -maxdepth 1 -mindepth 1 -type d | head -1)
          echo "模型目录：$DIR"
          ls -lh "$DIR"
          python3 scripts/onnx-json-to-tokens.py "$DIR"
          du -sh www/tts

      - name: 同步 web 资源、Capacitor 插件并登记 App 内原生插件
        # ios:sync = cap sync ios + register-native-plugins.cjs
        # 后者把四个 App 内插件写进 capacitor.config.json 的 packageClassList，
        # 必须在 cap sync 之后跑，否则会被覆盖
        run: npm run ios:sync

      - name: 确认四个原生插件已进入注册列表
        run: |
          node -e '
          const j = require("./ios/App/App/capacitor.config.json");
          const want = ["ShuyinAudioPlugin", "ShuyinSecureStorePlugin", "ShuyinOCRPlugin", "ShuyinSharePlugin"];
          const list = j.packageClassList || [];
          console.log("packageClassList: " + list.join(", "));
          const missing = want.filter((x) => !list.includes(x));
          if (missing.length) { console.error("缺少：" + missing.join(", ")); process.exit(1); }
          console.log("四个插件都在");
          '

      - name: 解析 Swift Package 依赖
        # 不解析就会报 "Missing package product 'sherpa-onnx'"——
        # pbxproj 里的四段都对，但包本身从没被 fetch 下来。
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -clonedSourcePackagesDirPath build/SourcePackages 2>&1 | tail -30

      - name: 编译（关闭签名，出未签名包）
        run: |
          set +e
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build > build.log 2>&1
          code=$?
          echo "--- xcodebuild exit=$code ---"
          echo "--- error 行 ---"
          grep -n "error:" build.log | head -60 || true
          echo "--- 日志尾部 ---"
          tail -n 60 build.log
          exit $code

      - name: 打包未签名 IPA
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          echo "APP=$APP"
          test -n "$APP"
          rm -rf dist
          mkdir -p dist/Payload
          # macOS 上必须用 cp -R：cp -r 会把 framework 里的符号链接解引用，签名/加载会出问题
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry Shuyin-unsigned.ipa Payload
          ls -l Shuyin-unsigned.ipa
          echo "--- Payload 结构 ---"
          find Payload -maxdepth 2 | head -30

      - name: 断言插件类已编进可执行文件、版本号正确
        run: |
          set -e
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          for s in ShuyinAudioPlugin ShuyinSecureStorePlugin ShuyinOCRPlugin ShuyinSharePlugin; do
            if ! strings -a "$APP/App" | grep -q "$s"; then
              echo "::error::$s 不在可执行文件里（编译了但没链接进来？）"
              exit 1
            fi
            echo "  $s 在二进制里"
          done
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          B=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          PKG=$(node -p "require('./package.json').version")
          echo "Info.plist: $V ($B) / package.json: $PKG"
          [ "$V" = "$PKG" ] || { echo "::error::版本号没从 package.json 写入"; exit 1; }

      - name: 记录包体信息
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          {
            echo "app_path=$APP"
            echo "ipa_size=$(stat -f%z dist/Shuyin-unsigned.ipa)"
            echo "--- Info.plist 关键字段 ---"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist" || true
            echo "--- 可执行文件 ---"
            file "$APP/App"
            echo "--- 插件是否进包 ---"
            ls "$APP" | grep -i shuyin || echo "(插件是编进主二进制的，不在顶层)"
            echo "--- 链接的 framework ---"
            otool -L "$APP/App" | head -25
          } | tee build-info.txt

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shuyin-unsigned-ipa
          path: |
            dist/Shuyin-unsigned.ipa
            build-info.txt
            build.log
          if-no-files-found: warn
          retention-days: 30
